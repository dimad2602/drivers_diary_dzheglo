name: driver_diary
description: "Дневник смен водителя: поездки за день и сводка."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Состояние и DI
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  get_it: ^9.3.0

  # Навигация
  go_router: ^18.0.2

  # Модели и сетевой слой (клиент генерируется из swagger)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  chopper: ^8.7.1
  http: ^1.6.0

  # Хранилища и окружение
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  envied: ^1.3.10

  # Локализация и утилиты
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Кодогенерация
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  chopper_generator: ^8.7.1
  swagger_dart_code_generator: ^4.1.1
  envied_generator: ^1.3.10
  intl_utils: ^2.8.17

  # Тесты
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

# Генерация локализации: dart run intl_utils:generate
flutter_intl:
  enabled: true
  main_locale: en
