include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Сгенерированный код
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/generated/**
    - lib/swagger_generated_code/**

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
